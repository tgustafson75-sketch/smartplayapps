<meta property="og:title" content="Tim Gustafson — SmartPlay AI">
<meta property="og:description" content="Founder, SmartPlay AI LLC. Intelligence made useful.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A0F1F; --indigo:#1A1F4D; --surface:#0D1327; --rule:#1E254A;
  --cobalt:#2563FF; --cobalt-hi:#6B93FF; --violet:#8B5CF6; --violet-hi:#A78BFA;
  --silver:#D1D5DB; --silver-dim:#8891A8; --off:#FAFAFC;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--navy); color:var(--off);
  font:400 16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; padding:28px 18px;
  background-image:
    radial-gradient(680px 420px at 12% -8%, rgba(37,99,255,.17), transparent 68%),
    radial-gradient(520px 380px at 92% 6%, rgba(139,92,246,.15), transparent 70%);
}
.card{
  width:100%; max-width:400px; background:var(--surface);
  border:1px solid var(--rule); border-radius:26px; overflow:hidden;
  box-shadow:0 28px 70px rgba(0,0,0,.55);
}
.top{
  padding:34px 30px 28px; text-align:center;
  background:linear-gradient(160deg, rgba(37,99,255,.13), rgba(139,92,246,.09) 60%, transparent);
  border-bottom:1px solid var(--rule);
}
.mark{width:62px; height:62px; border-radius:16px; display:block; margin:0 auto 18px}
.co{
  font-family:Sora,Inter,sans-serif; font-weight:700; font-size:13px;
  letter-spacing:.26em; text-transform:uppercase; color:var(--off); margin:0;
}
.co span{
  background:linear-gradient(92deg,var(--cobalt-hi),var(--violet-hi));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.tag{font-size:13px; color:var(--silver-dim); margin:9px 0 0; letter-spacing:.02em}

.who{padding:26px 30px 4px; text-align:center}
.name{font-family:Sora,Inter,sans-serif; font-weight:600; font-size:27px; letter-spacing:-.015em; margin:0}
.role{font-size:14px; color:var(--cobalt-hi); letter-spacing:.14em; text-transform:uppercase; margin:8px 0 0; font-weight:600}

.rows{padding:22px 22px 6px; display:grid; gap:10px}
a.row{
  display:flex; align-items:center; gap:14px; text-decoration:none;
  padding:14px 16px; border-radius:14px; background:rgba(255,255,255,.035);
  border:1px solid var(--rule); color:var(--off);
  transition:background .15s ease, border-color .15s ease, transform .15s ease;
}
a.row:hover{background:rgba(37,99,255,.12); border-color:var(--cobalt); transform:translateY(-1px)}
a.row:active{transform:translateY(0)}
.ic{
  flex:0 0 38px; height:38px; border-radius:11px; display:grid; place-items:center;
  background:linear-gradient(150deg,var(--cobalt),var(--violet));
}
.ic svg{width:18px; height:18px; display:block}
a.row > span:last-child{display:block; min-width:0}
.lab{display:block; font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--silver-dim); line-height:1}
.val{display:block; font-size:15px; font-weight:500; margin-top:5px; line-height:1.25; overflow-wrap:anywhere}

.qr{padding:24px 30px 4px; text-align:center}
.qr img{width:172px; height:172px; border-radius:14px; display:block; margin:0 auto; background:#fff}
.qr p{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--silver-dim); margin:14px 0 0}

footer{
  margin-top:22px; padding:18px 30px 26px; text-align:center;
  border-top:1px solid var(--rule);
}
.fs{font-family:Sora,Inter,sans-serif; font-weight:600; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--silver)}
.fc{font-size:11px; color:var(--silver-dim); margin-top:7px}

@media (max-width:380px){
  .top{padding:28px 22px 24px}
  .rows{padding:18px 16px 4px}
  .name{font-size:24px}
}
</style>
</head>
